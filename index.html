<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta id="theme-color-meta" name="theme-color" content="#080809" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perplexta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Perplexta AI" />
    <meta name="msapplication-TileColor" content="#080809" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="format-detection" content="telephone=no" />

    <style>
      :root {
        --pwa-theme-color: #080809;
        --pwa-bg-color: #080809;
      }
      :root.light {
        --pwa-theme-color: #fcfcfc;
        --pwa-bg-color: #fcfcfc;
      }
      html {
        background-color: var(--pwa-bg-color);
        color-scheme: dark light;
      }
      body {
        background-color: var(--pwa-bg-color);
        margin: 0;
        padding: 0;
      }
    </style>
    
    <!-- PWA Icons & Splash -->
    <link rel="apple-touch-icon" href="/app-assets/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/app-assets/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/app-assets/pwa-192x192.png" />
    <link rel="mask-icon" href="/app-assets/pwa-192x192.png" color="#10b981" />
    <meta name="description" content="Perplexta defines elite professional technical analysis and intelligent AI model orchestrations with dual-database ledgers." />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://perplexta.com/" />
    <meta property="og:title" content="Perplexta Platform - Elite AI Orchestration" />
    <meta property="og:description" content="Advanced AI analysis and model orchestration for professionals." />
    <meta property="og:image" content="/app-assets/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/app-assets/og-image.png" />

    <script>
      (function() {
        try {
          var savedLang = localStorage.getItem('language') || 'en';
          document.documentElement.setAttribute('lang', savedLang);
          document.documentElement.setAttribute('dir', savedLang === 'ar' ? 'rtl' : 'ltr');
          document.title = savedLang === 'ar' ? 'بيربليكستا - منصة التحليل والذكاء الاصطناعي الفاخر والمستقل' : 'Perplexta Platform - Professional Elite AI Platform';

          // Language-specific dynamic font loading setup
          var isAr = savedLang === 'ar';
          var fontUrl = isAr 
            ? 'https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap'
            : 'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap';
          var linkId = isAr ? 'font-stylesheet-tajawal' : 'font-stylesheet-space-grotesk';
          if (!document.getElementById(linkId)) {
            var fontLink = document.createElement('link');
            fontLink.id = linkId;
            fontLink.rel = 'stylesheet';
            fontLink.href = fontUrl;
            document.head.appendChild(fontLink);
          }

          var savedTheme = localStorage.getItem('theme');
          var isDark = false;
          if (savedTheme === 'dark') {
            isDark = true;
          } else if (savedTheme === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          
          var meta = document.getElementById('theme-color-meta');
          var root = document.documentElement;
          
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.style.setProperty('--pwa-theme-color', '#080809');
            root.style.setProperty('--pwa-bg-color', '#080809');
            root.style.backgroundColor = '#080809';
            root.style.color = '#f8fafc';
            if (meta) meta.setAttribute('content', '#080809');
          } else {
            root.classList.add('light');
            root.classList.remove('dark');
            root.style.setProperty('--pwa-theme-color', '#fcfcfc');
            root.style.setProperty('--pwa-bg-color', '#fcfcfc');
            root.style.backgroundColor = '#fcfcfc';
            root.style.color = '#0f172a';
            if (meta) meta.setAttribute('content', '#fcfcfc');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#080809';
          document.documentElement.style.color = '#f8fafc';
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.json" type="application/manifest+json" />
    <link rel="alternate" type="application/manifest+json" href="/manifest.webmanifest" />
  </head>
  <body class="layout-locked">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- WebMCP & PWA Analytics -->
    <script>
      (function() {
        // 1. WebMCP Tooling
        if (typeof navigator !== "undefined" && navigator.modelContext) {
          navigator.modelContext.provideContext({
            tools: [
              {
                name: "search",
                description: "Search Perplexta platform content",
                inputSchema: { type: "object", properties: { query: { type: "string" } }, required: ["query"] },
                execute: async ({ query }) => fetch(`/api/search?q=${encodeURIComponent(query)}`).then(r => r.json())
              },
              {
                name: "get_models",
                description: "Get active AI models",
                inputSchema: { type: "object", properties: {} },
                execute: async () => fetch("/api/models").then(r => r.json())
              }
            ]
          });
        }

        // 2. PWA Launch & Performance Intelligence
        try {
          window.addEventListener('load', function() {
            setTimeout(function() {
              const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
              const sessionKey = 'perplexta_init_' + new Date().toISOString().split('T')[0];
              if (sessionStorage.getItem(sessionKey)) return;

              const nav = performance.getEntriesByType('navigation')[0];
              const paint = performance.getEntriesByType('paint');
              const timing = {
                load: nav ? nav.loadEventEnd : 0,
                dom: nav ? nav.domContentLoadedEventEnd : 0,
                fcp: (paint.find(p => p.name === 'first-contentful-paint') || {}).startTime || 0
              };

              fetch('/api/system/launch-telemetry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mode: isStandalone ? 'standalone' : 'browser', timing, ts: new Date().toISOString() }),
                keepalive: true
              }).then(() => sessionStorage.setItem(sessionKey, '1')).catch(() => {});
            }, 3000);
          });
        } catch (e) {}
      })();
    </script>
  </body>
</html>
