<!doctype html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f0f11">
    <script>
      (function() {
        try {
          var settings = JSON.parse(localStorage.getItem('site_settings') || '{}');
          var lang = localStorage.getItem('language') || 'ar';
          var title = '...';
          if (settings) {
            title = lang === 'ar' ? (settings.siteNameAr || settings.siteName) : settings.siteName;
          }
          if (title) document.title = title;
          
          if (settings.faviconBase64) {
             var link = document.createElement('link');
             link.rel = 'icon';
             link.href = settings.faviconBase64;
             document.head.appendChild(link);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        background-color: #0f0f11 !important; /* Forces dark background to prevent any white flash */
        margin: 0;
        padding: 0;
      }
      /* Only apply light background if the light class is explicitly present */
      html.light, html.light body {
        background-color: #ffffff !important;
      }
    </style>
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW Registered'))
            .catch(err => console.log('SW Reg failed', err));
        });
      }
    </script>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0f0f11';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.backgroundColor = '#ffffff';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
