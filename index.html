    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f0f11">
    <script>
      (function() {
        try {
          var settings = JSON.parse(localStorage.getItem('site_settings') || '{}');
          var lang = localStorage.getItem('language') || 'ar';
          
          // Dynamic Language & Direction Setup
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

          // Dynamic Title Setup
          var title = '...';
          if (settings) {
            title = lang === 'ar' ? (settings.siteNameAr || settings.siteName) : settings.siteName;
          }
          if (title && title !== '...') {
            document.title = title;
          } else {
            document.title = lang === 'ar' ? 'بيربليكستا - منصة التحليل والذكاء الاصطناعي الفاخر' : 'Perplexta - Premium AI Platform';
          }
          
          // Dynamic Description & Keywords
          var desc = lang === 'ar' ? (settings.seoDescriptionAr || settings.siteDescriptionAr) : (settings.seoDescriptionEn || settings.siteDescription);
          if (desc) {
            var metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc) metaDesc.setAttribute('content', desc);
            
            // Sync Open Graph & Twitter description
            var ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc) ogDesc.setAttribute('content', desc);
            
            var twDesc = document.querySelector('meta[name="twitter:description"]');
            if (twDesc) twDesc.setAttribute('content', desc);
          }
          
          if (title && title !== '...') {
            var ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.setAttribute('content', title);
            
            var twTitle = document.querySelector('meta[name="twitter:title"]');
            if (twTitle) twTitle.setAttribute('content', title);
          }

          var keywords = lang === 'ar' ? settings.keywordsAr : settings.keywordsEn;
          if (keywords) {
            var metaKeys = document.querySelector('meta[name="keywords"]');
            if (metaKeys) metaKeys.setAttribute('content', keywords);
          }

          // Dynamic SEO Image Update
          var seoImg = settings.seoImageUrl;
          if (seoImg) {
            var ogImg = document.querySelector('meta[property="og:image"]');
            if (ogImg) ogImg.setAttribute('content', seoImg);
            
            var twImg = document.querySelector('meta[name="twitter:image"]');
            if (twImg) twImg.setAttribute('content', seoImg);
          }

          // Dynamic Google Site Verification
          var siteVerification = settings.googleSiteVerification;
          if (siteVerification) {
            var metaSV = document.querySelector('meta[name="google-site-verification"]');
            if (metaSV) metaSV.setAttribute('content', siteVerification);
          }

          // Dynamic Google Analytics Integration
          var gaId = settings.googleAnalyticsId || 'G-TJ89GYPD40';
          if (gaId) {
            var gaScript = document.createElement('script');
            gaScript.id = 'ga-script';
            gaScript.async = true;
            gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
            document.head.appendChild(gaScript);
            
            var gaInlineScript = document.createElement('script');
            gaInlineScript.id = 'ga-inline-script';
            gaInlineScript.innerHTML = 
              "window.dataLayer = window.dataLayer || [];\n" +
              "function gtag(){dataLayer.push(arguments);}\n" +
              "gtag('js', new Date());\n" +
              "gtag('config', '" + gaId + "');";
            document.head.appendChild(gaInlineScript);
            
            window.gtag = function(){ dataLayer.push(arguments); };
          }

          if (settings.faviconBase64) {
             var link = document.createElement('link');
             link.rel = 'icon';
             link.href = settings.faviconBase64;
             document.head.appendChild(link);
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body {
        background-color: #0f0f11 !important; /* Forces dark background to prevent any white flash */
        margin: 0;
        padding: 0;
      }
      /* Only apply light background if the light class is explicitly present */
      html.light, html.light body {
        background-color: #ffffff !important;
      }
    </style>
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW Registered'))
            .catch(err => console.log('SW Reg failed', err));
        });
      }
    </script>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('theme') || 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0f0f11';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            document.documentElement.style.backgroundColor = '#ffffff';
          }
        } catch (e) {}
      })();
    </script>
