<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta id="theme-color-meta" name="theme-color" content="#080809" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Perplexta" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Perplexta Platform - Professional Elite AI Platform</title>
    <meta name="description" content="Perplexta defines elite professional technical analysis and intelligent AI model orchestrations with dual-database ledgers." />

    <script>
      (function() {
        try {
          var savedLang = localStorage.getItem('language') || 'en';
          document.documentElement.setAttribute('lang', savedLang);
          document.documentElement.setAttribute('dir', savedLang === 'ar' ? 'rtl' : 'ltr');
          document.title = savedLang === 'ar' ? 'بيربليكستا - منصة التحليل والذكاء الاصطناعي الفاخر والمستقل' : 'Perplexta Platform - Professional Elite AI Platform';

          var isAr = savedLang === 'ar';
          var fontUrl = isAr
            ? 'https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap'
            : 'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap';
          var linkId = isAr ? 'font-stylesheet-tajawal' : 'font-stylesheet-space-grotesk';
          if (!document.getElementById(linkId)) {
            var fontLink = document.createElement('link');
            fontLink.id = linkId;
            fontLink.rel = 'stylesheet';
            fontLink.href = fontUrl;
            document.head.appendChild(fontLink);
          }

          var savedTheme = localStorage.getItem('theme');
          var isDark = false;
          if (savedTheme === 'dark') {
            isDark = true;
          } else if (savedTheme === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var meta = document.getElementById('theme-color-meta');
          if (isDark) {
            document.documentElement.className = 'dark';
            document.documentElement.style.backgroundColor = '#080809';
            document.documentElement.style.color = '#f8fafc';
            if (meta) meta.setAttribute('content', '#080809');
          } else {
            document.documentElement.className = 'light';
            document.documentElement.style.backgroundColor = '#fcfcfc';
            document.documentElement.style.color = '#0f172a';
            if (meta) meta.setAttribute('content', '#fcfcfc');
          }
        } catch (e) {
          document.documentElement.className = 'dark';
          document.documentElement.style.backgroundColor = '#080809';
          document.documentElement.style.color = '#f8fafc';
        }

        document.addEventListener('DOMContentLoaded', function() {
          document.body.classList.remove('layout-locked');
        });
      })();
    </script>
    <style>
      body.layout-locked * { visibility: hidden !important; }
      body.layout-locked img { display: none !important; }
    </style>
    <link rel="icon" type="image/png" href="/app-assets/icon.png" />
    <link rel="apple-touch-icon" href="/app-assets/icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://perplexta.com/" />
    <meta property="og:title" content="Perplexta Platform - Professional Elite AI Platform" />
    <meta property="og:description" content="Perplexta defines elite professional technical analysis and intelligent AI model orchestrations." />
    <meta property="og:image" content="/app-assets/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://perplexta.com/" />
    <meta property="twitter:title" content="Perplexta Platform - Professional Elite AI Platform" />
    <meta property="twitter:description" content="Perplexta defines elite professional technical analysis and intelligent AI model orchestrations." />
    <meta property="twitter:image" content="/app-assets/og-image.png" />

    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
    if (typeof navigator !== "undefined" && navigator.modelContext) {
      navigator.modelContext.provideContext({
        tools: [
          {
            name: "search",
            description: "Search Perplexta platform content and AI models",
            inputSchema: { type: "object", properties: { query: { type: "string", description: "Search query" } }, required: ["query"] },
            execute: async ({ query }) => fetch(`/api/search?q=${encodeURIComponent(query)}`).then(r => r.json())
          },
          {
            name: "get_models",
            description: "Get available AI models on Perplexta platform",
            inputSchema: { type: "object", properties: {} },
            execute: async () => fetch("/api/models").then(r => r.json())
          },
          {
            name: "get_status",
            description: "Get Perplexta platform health and status",
            inputSchema: { type: "object", properties: {} },
            execute: async () => fetch("/api/health").then(r => r.json())
          }
        ]
      });
    }
    </script>
  </body>
</html>
