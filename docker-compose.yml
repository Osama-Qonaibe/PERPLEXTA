# SOVEREIGN INFRASTRUCTURE ARCHITECTURE
services:
  # Core Application
  app:
    build: .
    container_name: platform_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_SSL_REQUIRED=false
      - DATABASE_URL=postgresql://platform_admin:sovereign_pass@db_core:5432/platform_core
      - LEDGER_DATABASE_URL=postgresql://platform_admin:sovereign_pass@db_ledger:5432/platform_ledger
      - JWT_SECRET=change_this_to_a_secure_random_string
      - VITE_APP_URL=http://your-server-ip:3000
    depends_on:
      db_core:
        condition: service_healthy
      db_ledger:
        condition: service_healthy
    networks:
      - platform_net

  # Core Database (Operational)
  db_core:
    image: postgres:15-alpine
    container_name: platform_db_core
    volumes:
      - core_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=platform_admin
      - POSTGRES_PASSWORD=sovereign_pass
      - POSTGRES_DB=platform_core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d platform_core"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_net

  # Ledger Database (Finance Vault)
  db_ledger:
    image: postgres:15-alpine
    container_name: platform_db_ledger
    volumes:
      - ledger_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=platform_admin
      - POSTGRES_PASSWORD=sovereign_pass
      - POSTGRES_DB=platform_ledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d platform_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - platform_net

networks:
  platform_net:
    driver: bridge

volumes:
  core_data:
  ledger_data:
